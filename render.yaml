# Render Blueprint for the CareerNova AI backend (FastAPI) - FREE plan.
# The same settings can be typed into an existing service (Dashboard -> careernova-api -> Settings).
# Secrets are NOT stored here: every "sync: false" value is entered in the Render dashboard by the owner.
# Database: Neon PostgreSQL (DB_* values + DB_SSLMODE=require). See DEPLOYMENT_AND_HANDOVER_GUIDE.md section 7.
#
# Free-plan facts this file is built around (render.com/docs/free):
#   * 512 MB RAM -> the local AI embedding model is NOT downloaded; search and matching use the tested
#     keyword fallback (PyTorch is never loaded when the model is absent).
#   * No pre-deploy command and no shell -> the database step runs in the build (Render's advice for free
#     services): backend/deploy_db.py creates a fresh database or applies normal Alembic upgrades.
#   * No persistent disk -> uploaded files (resumes, profile pictures) are lost on every deploy/restart;
#     the extracted resume data in PostgreSQL is kept.
#   * SMTP ports are blocked -> email goes through Brevo's HTTPS API (EMAIL_MODE=brevo).
#   * The service sleeps after 15 minutes without traffic; the first request then takes about a minute.
services:
  - type: web
    name: careernova-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install --upgrade pip &&
      pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt &&
      python -m backend.deploy_db --seed-if-empty
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: DB_HOST
        sync: false            # Neon host, e.g. ep-xxxx.<region>.aws.neon.tech (no https://, no port)
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false            # neondb
      - key: DB_USER
        sync: false            # neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false            # https://<your-project>.vercel.app (no trailing slash; comma-separate several)
      - key: FRONTEND_URL
        sync: false            # same Vercel URL (used in verification and password-reset links)
      - key: EMAIL_MODE
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false            # the sender address you verified in Brevo
      - key: MAIL_FROM_NAME
        value: CareerNova AI
      - key: LLM_PROVIDER
        value: none            # "groq" after adding YOUR GROQ_API_KEY; Ollama is not available on Render
